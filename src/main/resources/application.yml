spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/search_engine}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  sql:
    init:
      # All statements in schema.sql use IF NOT EXISTS, making this idempotent on every restart.
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          "[batch_size]": 50
        "[format_sql]": false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: 8080

search:
  embedding:
    enabled: ${EMBEDDING_ENABLED:false}
    provider: ${EMBEDDING_PROVIDER:mistral}
    api-key: ${MISTRAL_API_KEY:}
    model: ${EMBEDDING_MODEL:mistral-embed}
    dimensions: 1024
    timeout-millis: 5000
    batch-size: 10
  llm:
    enabled: ${LLM_ENABLED:true}
    api-key: ${MISTRAL_API_KEY:}
    model: ${LLM_MODEL:mistral-small-latest}
    timeout-millis: 15000
    max-tokens: 512
    cache-ttl-minutes: 60
  jina:
    search-api-key: ${JINA_API_KEY:}
    search-url: https://s.jina.ai
    timeout-millis: 8000
  rate-limit:
    max-concurrent: 100
    max-requests-per-minute: 30
    bot-check-enabled: true
  cache:
    search-ttl-minutes: 10
  enrichment:
    enabled: true
    top-n: 5
    max-concurrent-fetches: 20
    per-host-limit: 5
    fetch-timeout-millis: 4000
  providers:
    stackoverflow:
      base-url: https://api.stackexchange.com
      api-key: ${STACKEXCHANGE_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
